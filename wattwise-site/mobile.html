<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watt Wise: tonight's tip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone">
  <div class="top">
    <div class="brand"><div class="logo"></div><span>Watt Wise</span></div>
    <span class="viewing" style="padding:0">Flat F001 · <a href="index.html">Dashboard</a></span>
  </div>

  <div>
    <div class="eyebrow">Tonight's tip</div>
    <h1>Start the dishwasher after 22:00 UTC.</h1>
  </div>

  <div class="tile" style="padding:20px;border-radius:20px">
    <div class="label" style="margin-bottom:12px">Price through the evening</div>
    <div class="mini-bars" aria-hidden="true">
      <div style="height:80px;background:#D9622B"></div>
      <div style="height:86px;background:#D9622B"></div>
      <div style="height:82px;background:#D9622B"></div>
      <div style="height:78px;background:#D9622B"></div>
      <div style="height:30px;background:#8FB3A5"></div>
      <div style="height:30px;background:#8FB3A5"></div>
      <div style="height:28px;background:#1F7A5A"></div>
      <div style="height:30px;background:#1F7A5A"></div>
      <div style="height:28px;background:#1F7A5A"></div>
    </div>
    <div class="mini-labels"><span>15:00</span><span>19:00</span><span>23:00</span></div>
  </div>

  <div class="duo">
    <div class="tile"><div class="value">~1 SEK</div><div class="sub">saved per cycle (sample)</div></div>
    <div class="tile"><div class="value">Same kWh</div><div class="sub">only the timing moves</div></div>
  </div>

  <button class="btn primary">Remind me at 22:00</button>
  <button class="btn ghost">Not possible tonight</button>

  <p class="fine">Based on spot prices only, excluding VAT, fees and tax. Placeholder numbers for the concept.</p>
</main>
</body>
</html>
